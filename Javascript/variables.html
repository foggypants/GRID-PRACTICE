<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>String Conversion</p>
    <script>
        let x=10;
        let y=5;
        let z=x+y;
        let h=x-y;
        let a=x*y;
        let b=x/y;
        let name="John";
        let surname="Doe";
        document.write("The value of x is: " + x + "<br>");
        document.write("The value of y is: "+ y + "<br>");
        document.write("<hr>");
        document.write("The sum is: "+ z + "<br>");
        document.write("The subtraction is: " + h + "<br>");
        document.write("The multiplication is: "+ a + "<br>");
        document.write("The division is: "+ b + "<br>");
        document.write("<hr>");
        document.write("Full Name: "+ name + " " + surname + "<br>");
    </script>
    
</body>
</html>
